[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-mirror"
version = "0.4.0a0"
description = "Local-first motion transfer pipeline for animating a character image from a reference video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "halli75" }]
keywords = ["motion-transfer", "video-generation", "wan2.1", "vace", "diffusion", "character-animation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gradio>=5,<6",
  "typer>=0.12,<1",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "rembg>=2.0",
  "static-ffmpeg>=2.5",
  "ffmpeg-python>=0.2",
  "huggingface-hub>=0.23",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.15",
]
cuda = [
  "torch>=2.2",
  "torchvision>=0.17",
  "onnxruntime-gpu>=1.18",
  "rtmlib>=0.0.13",
]
cpu = [
  "torch>=2.2",
  "torchvision>=0.17",
  "onnxruntime>=1.18",
  "rtmlib>=0.0.13",
]
# Note: sam2 must be installed from GitHub: pip install git+https://github.com/facebookresearch/sam2.git
# RAFT weights are auto-downloaded by torchvision — no extra package needed.
gpu-inference = [
  # >=0.35.0: first release with WanVACETransformer3DModel in SINGLE_FILE_LOADABLE_CLASSES (GGUF single-file loading)
  "diffusers>=0.35.0",
  "gguf>=0.10.0",  # required by diffusers GGUFQuantizationConfig
  "transformers",
  "accelerate",
  "ftfy",
  "Pillow",
]

[project.urls]
Homepage = "https://github.com/halli75/motion-mirror"
Repository = "https://github.com/halli75/motion-mirror"
Issues = "https://github.com/halli75/motion-mirror/issues"

[project.scripts]
motion-mirror = "motion_mirror.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"motion_mirror" = ["presets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so the top-level comfyui_nodes package imports in tests.
pythonpath = ["."]
markers = [
  "gpu: marks tests requiring a CUDA GPU (deselect with -m 'not gpu')",
  "network: marks tests that hit the live Hugging Face API (run with -m network)",
  "slow: marks tests that take more than 30 seconds",
]

[tool.ruff]
target-version = "py311"
line-length = 100
